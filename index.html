<!doctype html>
<html lang="is">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Hlustaðu — ný heimasíða er væntanleg.">
    <meta name="theme-color" content="#132b27">
    <title>Hlustaðu — væntanlegt</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #132b27;
        color: #f5f0e5;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main { width: 100%; max-width: 48rem; text-align: center; }
      .sound { display: flex; align-items: center; justify-content: center; gap: 8px; height: 64px; margin-bottom: 3rem; }
      .sound span { width: 6px; border-radius: 8px; background: #b9d8a3; height: 24px; }
      .sound span:nth-child(2), .sound span:nth-child(6) { height: 40px; }
      .sound span:nth-child(3), .sound span:nth-child(5) { height: 52px; }
      .sound span:nth-child(4) { height: 64px; }
      h1 { margin: 0; font-size: clamp(3rem, 12vw, 6.5rem); font-weight: 600; letter-spacing: -0.055em; line-height: 1.15; }
      .status { margin: 1.5rem 0 0; color: #b9d8a3; font-size: 1rem; letter-spacing: 0.2em; text-transform: uppercase; }
      .message { margin: 2rem 0 0; font-size: 1.125rem; line-height: 1.7; }
      footer { margin-top: 5rem; color: #b8c9c2; font-size: 0.875rem; }
    </style>
  </head>
  <body>
    <main>
      <div class="sound" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <h1>Hlustaðu</h1>
      <p class="status">Væntanlegt</p>
      <p class="message">Ný heimasíða er í vinnslu.<br>Við hlökkum til að taka á móti þér.</p>
      <footer>hlustadu.is</footer>
    </main>
  </body>
</html>
